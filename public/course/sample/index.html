<script>
/*
 * 맛보기 — 휴대폰이면 phone.html 로 넘긴다(대표님 2026-10-08, 「화면째 줄이기」).
 *
 * 강의안은 PC 화면에 띄우는 물건이라 좁은 화면에서 접으면 칸이 겹치고 잘렸다. phone.html 은 이 페이지를
 * 1280×720 틀(iframe, ?fit=0)에 그대로 열고 폭에 맞춰 줄인다 — 판매 페이지 미리보기와 같은 길.
 * PC · 판매 페이지 미리보기(?bare=1) · 틀 안(?fit=0)에는 걸리지 않는다.
 * 만드는 곳: scripts/sample-phone-fit.html · scripts/sample-phone.html → build-course-sample.mjs.
 */
(function () {
  var q = location.search;
  if (/[?&](bare=1|fit=0)/.test(q)) return;
  if (window.top !== window.self) return;
  function phone() {
    var small = Math.min(screen.width, screen.height) < 900;
    var touch = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || navigator.maxTouchPoints > 0;
    return small && touch;
  }
  function go() { location.replace("phone.html" + q + location.hash); }
  if (phone()) return go();
  /* 몇몇 브라우저는 읽기 시작할 때 화면 크기를 늦게 알린다 — 다 읽은 뒤 한 번 더 본다. */
  document.addEventListener("DOMContentLoaded", function () { if (phone()) go(); });
})();
</script>
