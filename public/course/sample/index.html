/*
 * 맛보기 — 휴대폰이면 phone.html 로 넘긴다(대표님 2026-10-08, 「화면째 줄이기」).
 *
 * 강의안은 PC 화면에 띄우는 물건이라 좁은 화면에서 접으면 칸이 겹치고 잘렸다. phone.html 은 이 페이지를
 * 1280×720 틀(iframe, ?fit=0)에 그대로 열고 폭에 맞춰 줄인다 — 판매 페이지 미리보기와 같은 길.
 * PC · 판매 페이지 미리보기(?bare=1) · 틀 안(?fit=0)에는 걸리지 않는다.
 * 만드는 곳: scripts/sample-phone-fit.html · scripts/sample-phone.html → build-course-sample.mjs.
 */
(function () {
  var q = location.search;
  if (/[?&](bare=1|fit=0)/.test(q)) return;
  if (window.top !== window.self) return;
  function phone() {
    var small = Math.min(screen.width, screen.height) < 900;
    var touch = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || navigator.maxTouchPoints > 0;
    return small && touch;
  }
  function go() { location.replace("phone.html" + q + location.hash); }
  if (phone()) return go();
  /* 몇몇 브라우저는 읽기 시작할 때 화면 크기를 늦게 알린다 — 다 읽은 뒤 한 번 더 본다. */
  document.addEventListener("DOMContentLoaded", function () { if (phone()) go(); });
})();
</script>

<style>
  /* ── 「샘플용 한국어 박스」 ── 크게, 비스듬히, 글은 읽히게. */
  #kbSample{

    display:grid; place-content:center; overflow:hidden;
    /* 크되 글을 이기지는 않게. 이 값을 올리면 슬라이드가 안 읽힌다. */

  #kbSample span{

    font-size:clamp(30px,4.6vw,64px); letter-spacing:2px; color:#14213d;

  /*
   * 파는 화면에 끼워 넣은 조각(?bare=1 · components/sales/slide-frame.tsx)에서는

  /* 끼워 넣은 조각에서는 알림과 가림막이 뜰 일이 없다 — 누를 수 없는 그림이다. */

  /* ── 창이 물러난 사이 ── 갈무리 도구를 띄우면 창은 반드시 물러난다. */
  #kbHide{

    /* 틈 없이 덮는다 — 살짝 비치면 그 틈으로 찍힌다. */

  }
  html.kb-away #kbHide{ display:grid; }
  html.kb-away .stage{ filter:blur(18px); }
  #kbHide b{ display:block; font-size:22px; line-height:1.5; color:#14213d; }
  #kbHide p{ margin:10px 0 0; font-size:14px; line-height:1.7; color:#4a4436; }
  /* ── 걸렸을 때 뜨는 알림 ── */

    font:800 15px/1.6 "Noto Sans KR",system-ui,sans-serif; text-align:center;
    transition:transform .22s ease;
  }

<script>
(function(){
  /* ① 이름표를 화면 높이만큼 채운다. */
  var box = document.getElementById('kbSample');
  function draw(){
    var rows = Math.ceil(window.innerHeight / 120) + 3;
    var line = ('샘플용 한국어 박스' + '\u00a0\u00a0·\u00a0\u00a0').repeat(6);
    var html = '';
    for(var i=0;i<rows;i++) html += '<span>' + line + '</span>';
    box.innerHTML = html;
  }
  draw();
  window.addEventListener('resize', draw);

  /* ② 걸렸다고 말한다. */
  var no = document.getElementById('kbNo');
  var timer = null;
  function tell(why){
    no.innerHTML = '보안상 화면 갈무리(캡처)를 할 수 없습니다' +
      '<small>' + why + ' · 샘플용 한국어 박스</small>';
    no.classList.add('on');
    if(timer) clearTimeout(timer);
    timer = setTimeout(function(){ no.classList.remove('on'); }, 3200);
  }

  /* ③ PrintScreen — 눌린 것은 알 수 있다. 담긴 판을 덮어 쓰고 알린다. */
  function wipe(){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText('샘플용 한국어 박스 — 이 화면은 갈무리할 수 없습니다 · koreanbox.co.kr');
      }
    }catch(e){}
  }
  document.addEventListener('keyup', function(e){
    if(e.key === 'PrintScreen' || e.code === 'PrintScreen'){ wipe(); tell('PrintScreen'); }
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    var meta = e.ctrlKey || e.metaKey;
    /* 인쇄 · 저장 · 맥의 갈무리 단축키 · 윈도 캡처 도구 */
    if(meta && (k === 'p' || k === 's')){ e.preventDefault(); tell(meta && k === 'p' ? '인쇄' : '저장'); return; }
    if(e.metaKey && e.shiftKey && ['3','4','5'].indexOf(k) >= 0){ e.preventDefault(); wipe(); tell('갈무리 단축키'); return; }
    if(e.shiftKey && meta && k === 's'){ e.preventDefault(); tell('갈무리 도구'); return; }
    if(e.key === 'PrintScreen'){ wipe(); tell('PrintScreen'); }
  });

  /* ④ 창이 물러나면 가린다 — 갈무리 도구는 창을 물러나게 한다. */
  var root = document.documentElement;
  function away(){ root.classList.add('kb-away'); }
  function back(){ root.classList.remove('kb-away'); }
  window.addEventListener('blur', away);
  window.addEventListener('focus', back);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) away(); else back(); });

  /* 무심코 새는 길. */
  ['contextmenu','dragstart','copy','cut'].forEach(function(ev){
    document.addEventListener(ev, function(e){
      e.preventDefault();
      if(ev === 'copy' || ev === 'cut') tell('복사');
    });
  });
})();
</script></body>
